# Nginx sits in front of Gunicorn: it terminates HTTPS, serves static files
# directly (faster than routing them through Python), and forwards everything
# else to the app.
#
# Install with:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/electronics-service-crm
#   sudo ln -s /etc/nginx/sites-available/electronics-service-crm /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP below with your actual domain (once you have one)
# or your EC2 instance's public IP for now.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    client_max_body_size 10M;

    # Static files served directly by Nginx — faster, and keeps Gunicorn
    # free to spend its time on actual application logic.
    location /static/ {
        alias /home/ubuntu/electronics-service-crm/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Once you have a real domain pointed at this server, run:
#   sudo apt install certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourdomain.com
# Certbot will automatically add the HTTPS (port 443) block above and start
# redirecting HTTP to HTTPS — free certificate, auto-renewing.
