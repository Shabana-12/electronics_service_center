<div class="modal-overlay" id="inventoryModal">
  <div class="modal wide">
    <div class="modal-head"><h3 id="inventoryModalTitle">New inventory entry</h3><button class="modal-close" onclick="closeInventoryForm()">✕</button></div>
    <form id="inventoryForm">
      <div class="modal-body" id="inventoryModalBody"></div>
      <div class="modal-foot"><button type="button" class="btn" onclick="closeInventoryForm()">Cancel</button><button type="submit" class="btn accent">Save entry</button></div>
    </form>
  </div>
</div>
