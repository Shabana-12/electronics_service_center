<div class="modal-overlay" id="resetPasswordModal">
  <div class="modal">
    <div class="modal-head"><h3 id="rp_title">Reset password</h3><button class="modal-close" onclick="closeResetPasswordForm()">✕</button></div>
    <form id="resetPasswordForm" onsubmit="saveResetPasswordForm(event)">
      <div class="modal-body">
        <input type="hidden" id="rp_username">
        <p style="color:var(--text-dim);font-size:12.5px;margin:0 0 12px;" id="rp_intro"></p>
        <div class="field" id="rp_currentPasswordField" style="display:none;">
          <label class="req">Current password</label>
          <div class="password-field">
            <input id="rp_currentPassword" type="password" autocomplete="current-password">
            <button type="button" class="password-toggle" data-toggle-for="rp_currentPassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field"><label class="req">New password</label>
          <div class="password-field">
            <input id="rp_password" type="password" required minlength="4" autocomplete="new-password">
            <button type="button" class="password-toggle" data-toggle-for="rp_password" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="field"><label class="req">Confirm new password</label>
          <div class="password-field">
            <input id="rp_password2" type="password" required minlength="4" autocomplete="new-password">
            <button type="button" class="password-toggle" data-toggle-for="rp_password2" aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="hint" id="rp_mismatchHint" style="display:none;color:var(--red);">Passwords don't match.</div>
      </div>
      <div class="modal-foot"><button type="button" class="btn" onclick="closeResetPasswordForm()">Cancel</button><button type="submit" class="btn accent">Save new password</button></div>
    </form>
  </div>
</div>
