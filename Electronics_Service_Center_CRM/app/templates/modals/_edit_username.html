<div class="modal-overlay" id="editUsernameModal">
  <div class="modal">
    <div class="modal-head"><h3>Edit username</h3><button class="modal-close" onclick="closeEditUsernameForm()">✕</button></div>
    <form id="editUsernameForm" onsubmit="saveEditUsernameForm(event)">
      <div class="modal-body">
        <input type="hidden" id="eu_oldUsername">
        <p style="color:var(--text-dim);font-size:12.5px;margin:0 0 12px;">Renaming <b id="eu_oldUsernameLabel"></b>. They'll need to sign in with the new username next time — their name, role, and all their past records stay exactly as they are.</p>
        <div class="field"><label class="req">New username</label><input id="eu_newUsername" required minlength="3"></div>
      </div>
      <div class="modal-foot"><button type="button" class="btn" onclick="closeEditUsernameForm()">Cancel</button><button type="submit" class="btn accent">Save username</button></div>
    </form>
  </div>
</div>
